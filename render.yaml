services:
  - type: web
    name: kabuka-bunseki-kun-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    autoDeploy: true

  - type: web
    name: kabuka-bunseki-kun-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "true"
    staticPublishPath: .
    autoDeploy: true
